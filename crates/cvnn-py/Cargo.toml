[package]
name = "clearvisionnn-py"
description = "Python bindings to the pre-process and the runtime (part of clearvisionNN)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# A Python extension module, built with maturin: not a crate for other Rust code.
publish = false

[lib]
name = "clearvisionnn_native"
crate-type = ["cdylib"]

[dependencies]
cvnn-common.workspace = true
cvnn-preproc.workspace = true
cvnn-runtime.workspace = true
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
numpy = "0.23"

[lints]
workspace = true
