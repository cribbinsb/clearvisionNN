# clearvisionNN Cargo workspace. Layout and rules: CLAUDE.md, docs/ARCHITECTURE.md.

[workspace]
resolver = "3"
members = [
    "crates/cvnn-common",
    "crates/cvnn-preproc",
    "crates/cvnn-runtime",
    "crates/cvnn-py",
    "crates/cvnn-web",
    "crates/cvnn-models",
    "crates/clearvisionnn",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "BSD-3-Clause"
repository = "https://github.com/cribbinsb/clearvisionNN"
homepage = "https://cribbinsb.github.io/clearvisionNN/"
keywords = ["video", "super-resolution", "upscaling", "realtime", "webgpu"]
categories = ["multimedia::video", "computer-vision"]

[workspace.dependencies]
# Published as `clearvisionnn-*` (crates.io), used as `fc_*` in Rust: each key is
# the directory and library name. The version is what a published crate
# resolves; the path is what the workspace builds.
cvnn-common = { package = "clearvisionnn-common", version = "0.1.0", path = "crates/cvnn-common" }
cvnn-preproc = { package = "clearvisionnn-preproc", version = "0.1.0", path = "crates/cvnn-preproc" }
cvnn-runtime = { package = "clearvisionnn-runtime", version = "0.1.0", path = "crates/cvnn-runtime" }
cvnn-models = { package = "clearvisionnn-models", version = "0.1.0", path = "crates/cvnn-models" }
# nanocodec's analysis, as published; the workspace builds it from a sibling
# checkout (../nanocodec), see docs/PROCEDURES.md.
nc-common = { package = "nanocodec-common", version = "0.4.0", path = "../nanocodec/crates/nc-common" }
nc-dsp = { package = "nanocodec-dsp", version = "0.4.0", path = "../nanocodec/crates/nc-dsp" }
nc-analysis = { package = "nanocodec-analysis", version = "0.4.0", path = "../nanocodec/crates/nc-analysis" }

[workspace.lints.rust]
# `deny`, not `forbid`: cvnn-py's binding macros expand to `unsafe` glue. Every
# other crate additionally has `#![forbid(unsafe_code)]`.
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pixel code converts between integer and float widths constantly, always with
# known ranges; these lints would bury real findings.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"

[profile.release]
opt-level = 3

# The browser module: whole-program optimisation, as it is downloaded and runs on one thread.
[profile.web]
inherits = "release"
lto = true
codegen-units = 1
